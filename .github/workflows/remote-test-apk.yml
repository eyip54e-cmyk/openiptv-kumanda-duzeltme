name: Remote navigation test APK

on:
  workflow_dispatch:
  push:
    branches:
      - remote-navigation-fix
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - ".github/workflows/remote-test-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build separate-install debug APK
        run: flutter build apk --debug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: openiptv-remote-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
